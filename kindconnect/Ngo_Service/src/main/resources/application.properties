# ===============================
# Application
# ===============================
spring.application.name=NGO-SERVICE
server.port=8084

# ===============================
# Database
# ===============================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ngo_db
spring.datasource.username=postgres
spring.datasource.password=2736

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================
jwt.secret=kindconnect-secret-key-12345678901234567890
jwt.expiration=86400000

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Donation Service (Client)
# ===============================
donation.service.url=http://localhost:8083

# ===============================
# Profile Service (Client)
# ===============================
profile.service.url=http://localhost:8082
